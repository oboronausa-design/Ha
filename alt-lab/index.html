<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><title>ALT//LAB — Visual FX Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#eee;font:14px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 36px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.logo{font-size:30px;font-weight:1000;font-style:italic;letter-spacing:-2px}.lime{color:#c3ff00}.tag{font-size:10px;letter-spacing:1.5px;color:#c3ff00}.stage{position:relative;background:#15151b;border:1px solid #444;border-radius:12px;overflow:hidden}.stage canvas{width:100%;height:auto;display:block;aspect-ratio:1/1}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn,.upload{display:flex;align-items:center;justify-content:center;min-height:44px;background:#1e1e25;border:1px solid #40404b;color:#f5f5f5;padding:11px 6px;border-radius:9px;font-weight:800;font-size:12px;text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.btn.active{background:#c3ff00;color:#050505;border-color:#c3ff00}input[type=file]{display:none}.section{color:#999;font-size:10px;letter-spacing:2px;margin:20px 0 11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.control{padding:10px 0 7px;border-bottom:1px solid #292932}.label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px}input[type=range]{width:100%;accent-color:#c3ff00;margin-top:12px;height:24px}.export{display:block;width:100%;background:#c3ff00;color:#080808;border:0;border-radius:9px;padding:15px;font-size:14px;font-weight:900;margin-top:12px}.status{color:#999;font-size:11px;margin-top:10px;line-height:1.5}button:active,.upload:active{transform:scale(.985)}
</style></head><body><main class="app">
<div class="head"><div class="logo">ALT//LAB <span class="lime">✦</span></div><div class="tag">● LIVE FX<br>V 1.0</div></div>
<div class="stage"><canvas id="screen" width="640" height="640"></canvas></div>
<div class="toolbar"><label class="upload" for="file">＋ ЗАГРУЗИТЬ ФОТО<input id="file" type="file" accept="image/*"></label><button class="btn active" id="play">Ⅱ АНИМАЦИЯ</button></div>
<div class="section">01 / EFFECT PRESETS</div><div class="grid" id="presets"></div>
<div class="section">02 / EFFECT PARAMETERS</div><div id="controls"></div>
<div class="section">03 / GRAPHIC OVERLAYS</div><div class="grid" id="overlays"></div>
<div class="toolbar"><button class="btn" id="random">⤨ RANDOMIZE</button><button class="btn" id="reset">↺ RESET</button></div>
<button class="export" id="export">EXPORT / PNG ↓</button><div class="status" id="status">640 × 640 • Обработка прямо в браузере • Фото не загружаются на сервер</div>
</main><script>
(()=>{'use strict';
const q=s=>document.querySelector(s),c=q('#screen'),ctx=c.getContext('2d',{willReadFrequently:true}),b=document.createElement('canvas');b.width=b.height=640;const g=b.getContext('2d',{willReadFrequently:true});
let photo=null,playing=true,t=0,last=0,mode='CHROME';
const names=['Contrast','Saturation','RGB Split','Glitch','Grain','Glow','Hue','Scanlines','Zoom','Distortion'];
const presets={'CHROME':[65,20,15,8,18,55,0,5,0,5],'ACID':[75,100,30,18,12,65,75,15,5,10],'VHS':[25,45,38,35,45,12,0,75,0,12],'DEMON':[85,85,20,30,30,30,340,20,8,15],'CYBER':[60,95,55,45,20,55,185,40,0,20],'DREAM':[15,55,8,0,8,85,290,0,0,8],'X-RAY':[90,0,20,15,20,30,0,10,0,0],'DECAY':[85,15,50,80,65,15,90,40,5,30],'RAW':[0,50,0,0,0,0,0,0,0,0]};
let vals=presets.CHROME.slice(),over=new Set(['STARS','TYPE']);
Object.keys(presets).forEach(n=>{const el=document.createElement('button');el.className='btn';el.textContent=n;el.onclick=()=>{mode=n;vals=presets[n].slice();update();draw()};q('#presets').append(el)});
names.forEach((n,i)=>{let el=document.createElement('div');el.className='control';el.innerHTML='<div class="label"><span>'+n.toUpperCase()+'</span><span>'+vals[i]+'</span></div><input aria-label="'+n+'" type="range" min="0" max="'+(i===6?360:100)+'" value="'+vals[i]+'">';el.querySelector('input').oninput=e=>{vals[i]=+e.target.value;el.querySelector('.label span:last-child').textContent=vals[i];draw()};q('#controls').append(el)});
['STARS','CROSSES','TYPE','FRAME','ORBIT','GRID'].forEach(n=>{let el=document.createElement('button');el.className='btn';el.textContent=n;el.onclick=()=>{over.has(n)?over.delete(n):over.add(n);el.classList.toggle('active',over.has(n));draw()};q('#overlays').append(el)});
function update(){document.querySelectorAll('.control').forEach((el,i)=>{el.querySelector('input').value=vals[i];el.querySelector('.label span:last-child').textContent=vals[i]});document.querySelectorAll('#presets .btn').forEach(el=>el.classList.toggle('active',el.textContent===mode));document.querySelectorAll('#overlays .btn').forEach(el=>el.classList.toggle('active',over.has(el.textContent)))}
function star(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);let grad=ctx.createLinearGradient(-r,-r,r,r);['#fff','#34343f','#fafaff','#777','#fff'].forEach((v,i)=>grad.addColorStop(i/4,v));ctx.fillStyle=grad;ctx.strokeStyle='#eee';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.18:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function draw(){let [co,sa,rgb,gl,gr,glow,hue,scan,zoom,dist]=vals;g.save();g.fillStyle='#08080d';g.fillRect(0,0,640,640);g.filter='contrast('+(100+co*1.6)+'%) saturate('+(sa*2)+'%) hue-rotate('+hue+'deg) '+(mode==='X-RAY'?'invert(1)':'');
if(photo){let s=Math.max(640/photo.width,640/photo.height)*(1+zoom/70),w=photo.width*s,h=photo.height*s;g.drawImage(photo,(640-w)/2,(640-h)/2,w,h)}else{let bg=g.createRadialGradient(320,300,10,320,320,450);bg.addColorStop(0,'#49225e');bg.addColorStop(1,'#080810');g.fillStyle=bg;g.fillRect(0,0,640,640);g.save();g.translate(320,320);g.rotate(t*.12);for(let j=0;j<20;j++){g.save();g.rotate(j*Math.PI/10);let m=g.createLinearGradient(-100,-200,100,200);m.addColorStop(0,'#fff');m.addColorStop(.3,'#222');m.addColorStop(.5,'#c7c7d9');m.addColorStop(.7,'#555');m.addColorStop(1,'#fff');g.fillStyle=m;g.beginPath();g.moveTo(0,-260);g.bezierCurveTo(150,-100,130,80,0,180);g.bezierCurveTo(-40,50,-30,-90,0,-260);g.fill();g.restore()}g.restore()}g.restore();ctx.clearRect(0,0,640,640);
if(dist){for(let y=0;y<640;y+=4){let dx=Math.sin(y*.025+t*2)*dist*.65;ctx.drawImage(b,0,y,640,4,dx,y,640,4)}}else ctx.drawImage(b,0,0);
if(rgb){let d=ctx.getImageData(0,0,640,640),a=new Uint8ClampedArray(d.data),shift=Math.round(rgb*.27);for(let y=0;y<640;y++){for(let x=0;x<640;x++){let i=(y*640+x)*4;d.data[i]=a[(y*640+Math.min(639,x+shift))*4];d.data[i+2]=a[(y*640+Math.max(0,x-shift))*4+2]}}ctx.putImageData(d,0,0)}
if(gl){for(let i=0;i<Math.ceil(gl/8);i++){let y=Math.random()*630,h=3+Math.random()*gl*.35;ctx.drawImage(b,0,y,640,h,(Math.random()-.5)*gl*2,y,640,h)}}
if(glow){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=glow/180;ctx.filter='blur('+(glow/4)+'px)';ctx.drawImage(b,0,0);ctx.restore()}
if(gr){for(let i=0;i<gr*85;i++){ctx.fillStyle=Math.random()>.5?'rgba(255,255,255,.18)':'rgba(0,0,0,.2)';ctx.fillRect(Math.random()*640,Math.random()*640,2,2)}}
if(scan){ctx.fillStyle='rgba(0,0,0,'+(scan/130)+')';for(let y=0;y<640;y+=5)ctx.fillRect(0,y,640,2)}
if(over.has('GRID')){ctx.strokeStyle='#ffffff25';ctx.lineWidth=1;for(let i=0;i<640;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,640);ctx.moveTo(0,i);ctx.lineTo(640,i);ctx.stroke()}}
if(over.has('ORBIT')){ctx.save();ctx.translate(320,320);ctx.rotate(t*.2);ctx.strokeStyle='#e7ffab';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,0,285,100,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}
if(over.has('STARS')){star(105,135,75,t*.4);star(520,465,95,-t*.3);star(540,95,30,t);star(125,520,35,-t)}
if(over.has('CROSSES')){for(let i=0;i<3;i++){ctx.save();ctx.translate(100+i*220,280+Math.sin(i*3+t)*65);ctx.rotate(-.25+i*.3);ctx.fillStyle='#c9c9dc';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-65);ctx.lineTo(12,-65);ctx.lineTo(12,-24);ctx.lineTo(48,-24);ctx.lineTo(48,0);ctx.lineTo(12,0);ctx.lineTo(12,70);ctx.lineTo(-12,70);ctx.lineTo(-12,0);ctx.lineTo(-48,0);ctx.lineTo(-48,-24);ctx.lineTo(-12,-24);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
if(over.has('TYPE')){ctx.fillStyle='#e5ffbd';ctx.font='bold 13px monospace';ctx.fillText('ALT//LAB — SIGNAL_001',22,28);ctx.fillText('NO SIGNAL / NO RULES',22,610);ctx.font='10px monospace';ctx.fillText('SYSTEM ERROR 0x004F',440,610);ctx.save();ctx.translate(615,400);ctx.rotate(-Math.PI/2);ctx.fillText('DIGITAL DECAY // VISUAL EXPERIMENT',0,0);ctx.restore()}
if(over.has('FRAME')){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(16,16,608,608);ctx.strokeRect(22,22,596,596)}
}
q('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;URL.revokeObjectURL(url);draw();q('#status').textContent='PHOTO LOADED • 640 × 640 • Обработка локально'};im.onerror=()=>{q('#status').textContent='Не удалось открыть фото. Попробуй JPG или PNG.';URL.revokeObjectURL(url)};im.src=url};
q('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Ⅱ АНИМАЦИЯ':'▶ АНИМАЦИЯ';e.target.classList.toggle('active',playing)};
q('#random').onclick=()=>{mode='CUSTOM';vals=names.map((n,i)=>Math.floor(Math.random()*(i===6?360:i===8?20:85)));update();draw()};
q('#reset').onclick=()=>{mode='RAW';vals=presets.RAW.slice();over.clear();update();draw()};
q('#export').onclick=()=>{c.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ALT-LAB.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);q('#status').textContent='PNG подготовлен. На iPhone проверь папку «Загрузки».'},'image/png')};
vals=presets.CHROME.slice();update();draw();function tick(now){if(playing&&now-last>90){t+=.09;draw();last=now}requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
