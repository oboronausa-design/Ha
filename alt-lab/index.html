if(photo){let s=Math.max(640/photo.width,640/photo.height)*(1+zoom/70),w=photo.width*s,h=photo.height*s;g.drawImage(photo,(640-w)/2,(640-h)/2,w,h)}else{let bg=g.createRadialGradient(320,300,10,320,320,450);bg.addColorStop(0,'#49225e');bg.addColorStop(1,'#080810');g.fillStyle=bg;g.fillRect(0,0,640,640);g.save();g.translate(320,320);g.rotate(t*.12);for(let j=0;j<20;j++){g.save();g.rotate(j*Math.PI/10);let m=g.createLinearGradient(-100,-200,100,200);m.addColorStop(0,'#fff');m.addColorStop(.3,'#222');m.addColorStop(.5,'#c7c7d9');m.addColorStop(.7,'#555');m.addColorStop(1,'#fff');g.fillStyle=m;g.beginPath();g.moveTo(0,-260);g.bezierCurveTo(150,-100,130,80,0,180);g.bezierCurveTo(-40,50,-30,-90,0,-260);g.fill();g.restore()}g.restore()}g.restore();ctx.clearRect(0,0,640,640);
if(dist){for(let y=0;y<640;y+=4){let dx=Math.sin(y*.025+t*2)*dist*.65;ctx.drawImage(b,0,y,640,4,dx,y,640,4)}}else ctx.drawImage(b,0,0);
if(rgb){let d=ctx.getImageData(0,0,640,640),a=new Uint8ClampedArray(d.data),shift=Math.round(rgb*.27);for(let y=0;y<640;y++){for(let x=0;x<640;x++){let i=(y*640+x)*4;d.data[i]=a[(y*640+Math.min(639,x+shift))*4];d.data[i+2]=a[(y*640+Math.max(0,x-shift))*4+2]}}ctx.putImageData(d,0,0)}
if(gl){for(let i=0;i<Math.ceil(gl/8);i++){let y=Math.random()*630,h=3+Math.random()*gl*.35;ctx.drawImage(b,0,y,640,h,(Math.random()-.5)*gl*2,y,640,h)}}
if(glow){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=glow/180;ctx.filter='blur('+(glow/4)+'px)';ctx.drawImage(b,0,0);ctx.restore()}
if(gr){for(let i=0;i<gr*85;i++){ctx.fillStyle=Math.random()>.5?'rgba(255,255,255,.18)':'rgba(0,0,0,.2)';ctx.fillRect(Math.random()*640,Math.random()*640,2,2)}}
if(scan){ctx.fillStyle='rgba(0,0,0,'+(scan/130)+')';for(let y=0;y<640;y+=5)ctx.fillRect(0,y,640,2)}
creative();extraDraw();motionDraw();
if(over.has('GRID')){ctx.strokeStyle='#ffffff25';ctx.lineWidth=1;for(let i=0;i<640;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,640);ctx.moveTo(0,i);ctx.lineTo(640,i);ctx.stroke()}}
if(over.has('ORBIT')){ctx.save();ctx.translate(320,320);ctx.rotate(t*.2);ctx.strokeStyle='#e7ffab';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,0,285,100,0,0,Math.PI*2);ctx.stroke()}ctx.restore()}
if(over.has('STARS')){for(let i=0;i<starCfg.count;i++){let x=65+(i*137)%510,y=65+(i*211)%510;star(x,y,starCfg.size*(.55+(i%3)*.22),t*starCfg.spin*.025+i)}}
if(over.has('CROSSES')){for(let i=0;i<3;i++){ctx.save();ctx.translate(100+i*220,280+Math.sin(i*3+t)*65);ctx.rotate(-.25+i*.3);ctx.fillStyle='#c9c9dc';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-65);ctx.lineTo(12,-65);ctx.lineTo(12,-24);ctx.lineTo(48,-24);ctx.lineTo(48,0);ctx.lineTo(12,0);ctx.lineTo(12,70);ctx.lineTo(-12,70);ctx.lineTo(-12,0);ctx.lineTo(-48,0);ctx.lineTo(-48,-24);ctx.lineTo(-12,-24);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
if(over.has('TYPE')){ctx.fillStyle='#e5ffbd';ctx.font='bold 13px monospace';ctx.fillText('ALT//LAB — SIGNAL_001',22,28);ctx.fillText('NO SIGNAL / NO RULES',22,610);ctx.font='10px monospace';ctx.fillText('SYSTEM ERROR 0x004F',440,610);ctx.save();ctx.translate(615,400);ctx.rotate(-Math.PI/2);ctx.fillText('DIGITAL DECAY // VISUAL EXPERIMENT',0,0);ctx.restore()}
if(over.has('FRAME')){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(16,16,608,608);ctx.strokeRect(22,22,596,596)}
}
q('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;URL.revokeObjectURL(url);draw();q('#status').textContent='PHOTO LOADED • 640 × 640 • Обработка локально'};im.onerror=()=>{q('#status').textContent='Не удалось открыть фото. Попробуй JPG или PNG.';URL.revokeObjectURL(url)};im.src=url};
q('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Ⅱ АНИМАЦИЯ':'▶ АНИМАЦИЯ';e.target.classList.toggle('active',playing)};
q('#random').onclick=()=>{mode='CUSTOM';vals=presets.RAW.slice();vals[0]=Math.random()*40;vals[1]=30+Math.random()*50;vals[5]=Math.random()*35;update();draw()};
q('#reset').onclick=()=>{mode='RAW';vals=presets.RAW.slice();over.clear();for(const n of effects)fx[n]=0;for(const n of more)extraFX[n]=0;[...eg.children].forEach(el=>el.classList.remove('active'));motion.pulse=motion.rotate=motion.drift=0;document.querySelectorAll('#creative button').forEach(el=>el.classList.remove('active'));document.querySelectorAll('#creativeControls .control').forEach(el=>{el.hidden=true;el.querySelector('input').value=0;el.querySelector('.label span:last-child').textContent=0});update();draw()};
q('#export').onclick=()=>{c.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ALT-LAB.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);q('#status').textContent='PNG подготовлен. На iPhone проверь папку «Загрузки».'},'image/png')};
mode='RAW';vals=presets.RAW.slice();update();draw();function tick(now){if(playing&&now-last>42){t+=.09*motion.speed/50;draw();last=now}requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
