function altProcess(a,w,h,amount){let g=a.getContext('2d');let active=["vhs","poster","dither","invertfx","scan","edge","pixel","kaleido","strobe","duo"].some(k=>amount(k)>0);if(!active)return;let tmp=fxCanvas;if(tmp.width!==w||tmp.height!==h){tmp.width=w;tmp.height=h}let q=tmp.getContext('2d');q.clearRect(0,0,w,h);q.drawImage(a,0,0);let pix=amount('pixel');if(pix){let f=Math.max(2,Math.round(1+pix/3)),sw=Math.max(1,Math.floor(w/f)),sh=Math.max(1,Math.floor(h/f));g.clearRect(0,0,w,h);g.imageSmoothingEnabled=false;g.drawImage(tmp,0,0,sw,sh);q.clearRect(0,0,w,h);q.drawImage(a,0,0,sw,sh,0,0,w,h);g.clearRect(0,0,w,h);g.drawImage(tmp,0,0);g.imageSmoothingEnabled=true}let kale=amount('kaleido');if(kale){q.clearRect(0,0,w,h);q.drawImage(a,0,0);g.save();g.globalAlpha=kale/100;for(let i=1;i<6;i++){g.save();g.translate(w/2,h/2);g.rotate(i*Math.PI/3);g.scale(i%2?-1:1,1);g.drawImage(tmp,-w/2,-h/2);g.restore()}g.restore()}let vhs=amount('vhs'),post=amount('poster'),noise=amount('dither'),neg=amount('invertfx'),scan=amount('scan'),edge=amount('edge'),duo=amount('duo'),strobe=amount('strobe');if(vhs||post||noise||neg||scan||edge||duo||strobe){let im=g.getImageData(0,0,w,h),d=im.data,orig=edge||vhs?new Uint8ClampedArray(d):d;let levels=Math.max(2,Math.round(32-post*.3)),shift=Math.round(vhs*.15);for(let y=0;y<h;y++){let line=1-(y%4===0?scan*.008:0);for(let x=0;x<w;x++){let i=(y*w+x)*4;if(!d[i+3])continue;let R=d[i],G=d[i+1],B=d[i+2];if(vhs){R=orig[(y*w+Math.max(0,x-shift))*4];B=orig[(y*w+Math.min(w-1,x+shift))*4]}if(post){R=Math.round(R/255*(levels-1))*255/(levels-1);G=Math.round(G/255*(levels-1))*255/(levels-1);B=Math.round(B/255*(levels-1))*255/(levels-1)}if(duo){let z=(R*.299+G*.587+B*.114)/255,f=duo/100;R=R*(1-f)+(35+220*z)*f;G=G*(1-f)+(10+245*Math.pow(z,2))*f;B=B*(1-f)+(100+100*(1-z))*f}if(edge){let j=(y*w+Math.min(w-1,x+2))*4,k=(Math.min(h-1,y+2)*w+x)*4,e=Math.min(255,(Math.abs(orig[i]-orig[j])+Math.abs(orig[i+1]-orig[k+1]))*3),f=edge/100;R=R*(1-f)+e*f;G=G*(1-f)+e*.15*f;B=B*(1-f)+e*f}let n=(Math.random()-.5)*noise*1.6;let f=neg/100;R=R*(1-f)+(255-R)*f;G=G*(1-f)+(255-G)*f;B=B*(1-f)+(255-B)*f;let flash=strobe&&Math.sin(t*18)>0?strobe*.65:0;d[i]=(R+n)*line+flash;d[i+1]=(G+n)*line+flash;d[i+2]=(B+n)*line+flash}}g.putImageData(im,0,0)}}
